plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'dev.legendsofmedieval'
version = mod_version
base { archivesName = 'lom-magic' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client { workingDirectory project.file('run'); mods { lommagic { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { lommagic { source sourceSets.main } } }
    }
}
repositories {
    maven { url = 'https://code.redspace.io/releases' }
    maven { url = 'https://cursemaven.com' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:irons-spells-n-spellbooks-855414:8680180")
    implementation fg.deobf("curse.maven:waystones-245755:7682270")
    implementation fg.deobf("curse.maven:balm-531761:8545415")
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

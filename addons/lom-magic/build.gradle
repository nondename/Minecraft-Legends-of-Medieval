plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
group = 'dev.legendsofmedieval'
version = mod_version
base { archivesName = 'lom-magic' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        client { workingDirectory project.file('run'); mods { lommagic { source sourceSets.main } } }
        server { workingDirectory project.file('run'); mods { lommagic { source sourceSets.main } } }
    }
}
repositories {
    maven { url = 'https://code.redspace.io/releases' }
    maven { url = 'https://cursemaven.com' }
}
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // 3.16.3 API version requires validation against the currently published Maven coordinate.
    compileOnly fg.deobf("io.redspace.ironsspellbooks:irons_spellbooks:1.20.1-3.16.3:api")
    runtimeOnly fg.deobf("io.redspace.ironsspellbooks:irons_spellbooks:1.20.1-3.16.3")
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

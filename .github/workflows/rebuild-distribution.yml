name: Rebuild distribution manifest

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'distribution.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: distribution-dev
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Restore pinned Regions Unexplored
        shell: bash
        run: |
          set -euo pipefail
          path='mods/RegionsUnexploredForge-0.5.6+1.20.1.jar'
          if [ -f "$path" ]; then
            echo "Regions Unexplored is already committed"
            exit 0
          fi

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://cdn.modrinth.com/data/Tkikq67H/versions/XTrgsfIB/RegionsUnexploredForge-0.5.6%2B1.20.1.jar' \
            --output "$path"

          python3 - "$path" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as jar:
              bad = jar.testzip()
              if bad is not None:
                  raise SystemExit(f"corrupt Regions Unexplored JAR entry: {bad}")
              try:
                  mods_toml = jar.read("META-INF/mods.toml").decode("utf-8", "replace")
              except KeyError as exc:
                  raise SystemExit("Regions Unexplored JAR has no META-INF/mods.toml") from exc
              if "regions_unexplored" not in mods_toml:
                  raise SystemExit("downloaded JAR is not Regions Unexplored")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "feat(worldgen): restore Regions Unexplored 0.5.6"

      - name: Rebuild distribution.json from committed Git blobs
        run: python3 tools/rebuild_distribution.py --write

      - name: Commit synchronized manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add distribution.json
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize distribution manifest"
          else
            echo "distribution.json is already synchronized"
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/dev)" ]; then
            git push origin HEAD:dev
          fi

      - name: Validate synchronized manifest
        run: python3 tools/rebuild_distribution.py

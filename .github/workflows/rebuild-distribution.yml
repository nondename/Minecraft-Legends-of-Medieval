name: Rebuild distribution manifest

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'distribution.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: distribution-dev
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Restore pinned Regions Unexplored
        shell: bash
        run: |
          set -euo pipefail
          path='mods/RegionsUnexploredForge-0.5.6+1.20.1.jar'
          if [ -f "$path" ]; then
            echo "Regions Unexplored is already committed"
            exit 0
          fi

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://cdn.modrinth.com/data/Tkikq67H/versions/XTrgsfIB/RegionsUnexploredForge-0.5.6%2B1.20.1.jar' \
            --output "$path"

          python3 - "$path" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as jar:
              bad = jar.testzip()
              if bad is not None:
                  raise SystemExit(f"corrupt Regions Unexplored JAR entry: {bad}")
              try:
                  mods_toml = jar.read("META-INF/mods.toml").decode("utf-8", "replace")
              except KeyError as exc:
                  raise SystemExit("Regions Unexplored JAR has no META-INF/mods.toml") from exc
              if "regions_unexplored" not in mods_toml:
                  raise SystemExit("downloaded JAR is not Regions Unexplored")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "feat(worldgen): restore Regions Unexplored 0.5.6"

      - name: Restore pinned LAN Server Properties
        shell: bash
        run: |
          set -euo pipefail
          path='mods/lanserverproperties-1.11.1-forge.jar'
          expected_sha256='dd59193804b778cf8d42284695b325d945150e4a973fb04e961fcd8b0c807b89'

          if [ -f "$path" ]; then
            actual_sha256="$(sha256sum "$path" | awk '{print $1}')"
            if [ "$actual_sha256" != "$expected_sha256" ]; then
              echo "LAN Server Properties exists but has the wrong SHA-256" >&2
              exit 1
            fi
            echo "LAN Server Properties is already committed and verified"
            exit 0
          fi

          curl --fail --location --retry 4 --retry-delay 2 \
            'https://github.com/rikka0w0/LanServerProperties/releases/download/1.11.1_1.20.1/lanserverproperties-1.11.1-forge.jar' \
            --output "$path"

          actual_sha256="$(sha256sum "$path" | awk '{print $1}')"
          if [ "$actual_sha256" != "$expected_sha256" ]; then
            echo "LAN Server Properties SHA-256 mismatch: $actual_sha256" >&2
            exit 1
          fi

          python3 - "$path" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as jar:
              bad = jar.testzip()
              if bad is not None:
                  raise SystemExit(f"corrupt LAN Server Properties JAR entry: {bad}")
              try:
                  mods_toml = jar.read("META-INF/mods.toml").decode("utf-8", "replace")
              except KeyError as exc:
                  raise SystemExit("LAN Server Properties JAR has no META-INF/mods.toml") from exc
              if "lanserverproperties" not in mods_toml:
                  raise SystemExit("downloaded JAR is not LAN Server Properties")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$path"
          git commit -m "feat(lan): add LAN Server Properties 1.11.1"

      - name: Restore pinned MineColonies stack
        shell: bash
        run: |
          set -euo pipefail

          base='https://ldtteam.jfrog.io/ldtteam/modding'

          download_mod() {
            local path="$1"
            local url="$2"
            local modid="$3"

            if [ -f "$path" ]; then
              echo "$path is already committed"
              return 0
            fi

            echo "Downloading $path"
            curl --fail --location --retry 4 --retry-delay 2 \
              "$url" \
              --output "$path"

            python3 - "$path" "$modid" <<'PY'
          import sys
          import zipfile

          path, modid = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(path) as jar:
              bad = jar.testzip()
              if bad is not None:
                  raise SystemExit(f"corrupt JAR entry in {path}: {bad}")
              try:
                  mods_toml = jar.read("META-INF/mods.toml").decode("utf-8", "replace")
              except KeyError as exc:
                  raise SystemExit(f"{path} has no META-INF/mods.toml") from exc
              if modid not in mods_toml:
                  raise SystemExit(f"{path} does not contain expected mod id {modid}")
          PY
          }

          download_mod \
            'mods/minecolonies-1.20.1-1.1.1301.jar' \
            "$base/com/ldtteam/minecolonies/1.20.1-1.1.1301/minecolonies-1.20.1-1.1.1301.jar" \
            'minecolonies'

          download_mod \
            'mods/structurize-1.20.1-1.0.818.jar' \
            "$base/com/ldtteam/structurize/1.20.1-1.0.818/structurize-1.20.1-1.0.818.jar" \
            'structurize'

          download_mod \
            'mods/blockui-1.20.1-1.0.193.jar' \
            "$base/com/ldtteam/blockui/1.20.1-1.0.193/blockui-1.20.1-1.0.193.jar" \
            'blockui'

          download_mod \
            'mods/domum_ornamentum-1.20.1-1.0.296-universal.jar' \
            "$base/com/ldtteam/domum_ornamentum/1.20.1-1.0.296/domum_ornamentum-1.20.1-1.0.296-universal.jar" \
            'domum_ornamentum'

          download_mod \
            'mods/multipiston-1.20-1.2.43-RELEASE.jar' \
            'https://www.cursemaven.com/curse/maven/multi-piston-303278/5204918/multi-piston-303278-5204918.jar' \
            'multipiston'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            mods/minecolonies-1.20.1-1.1.1301.jar \
            mods/structurize-1.20.1-1.0.818.jar \
            mods/blockui-1.20.1-1.0.193.jar \
            mods/domum_ornamentum-1.20.1-1.0.296-universal.jar \
            mods/multipiston-1.20-1.2.43-RELEASE.jar

          if ! git diff --cached --quiet; then
            git commit -m "feat(modpack): add MineColonies 1.20.1 stack"
          else
            echo "MineColonies stack is already committed"
          fi

      - name: Rebuild distribution.json from committed Git blobs
        run: python3 tools/rebuild_distribution.py --write

      - name: Commit synchronized manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add distribution.json
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize distribution manifest"
          else
            echo "distribution.json is already synchronized"
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/dev)" ]; then
            git push origin HEAD:dev
          fi

      - name: Validate synchronized manifest
        run: python3 tools/rebuild_distribution.py

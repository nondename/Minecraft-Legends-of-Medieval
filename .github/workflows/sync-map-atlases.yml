name: Sync LoM Map Atlases

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/sync-map-atlases.yml
  workflow_dispatch:
    inputs:
      map_atlases_ref:
        description: Map Atlases commit/branch/tag to build
        required: false
        default: 08b123ce4d5ebc1ae63d341b8d7304be7d318798

permissions:
  contents: write

concurrency:
  group: sync-map-atlases-dev
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      MAP_ATLASES_REF: ${{ github.event.inputs.map_atlases_ref || '08b123ce4d5ebc1ae63d341b8d7304be7d318798' }}
      TARGET_JAR: mods/map_atlases-1.20-6.0.20.jar

    steps:
      - name: Checkout LoM dev
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build LoM Map Atlases fork
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/nondename/mapatlases-neoforge.git /tmp/mapatlases
          cd /tmp/mapatlases
          git checkout "$MAP_ATLASES_REF"
          chmod +x gradlew
          ./gradlew :forge:build --no-daemon
          test -f 'forge/build/libs/map_atlases-1.20-6.0.20.jar'

      - name: Replace Map Atlases
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          cp '/tmp/mapatlases/forge/build/libs/map_atlases-1.20-6.0.20.jar' "$TARGET_JAR"

          python3 - "$TARGET_JAR" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as jar:
              bad = jar.testzip()
              if bad is not None:
                  raise SystemExit(f"corrupt Map Atlases JAR entry: {bad}")
              try:
                  mods_toml = jar.read("META-INF/mods.toml").decode("utf-8", "replace")
              except KeyError as exc:
                  raise SystemExit("Map Atlases JAR has no META-INF/mods.toml") from exc
              if "map_atlases" not in mods_toml:
                  raise SystemExit("built JAR is not Map Atlases")
          PY

          sha256sum "$TARGET_JAR"

          if git diff --quiet -- "$TARGET_JAR"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Map Atlases payload is already current.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Map Atlases payload
        if: steps.pack.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET_JAR"
          git commit -m 'mods: integrate LoM Map Atlases fork'

      - name: Bump pack update version
        if: steps.pack.outputs.changed == 'true'
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('distribution.json')
          data = json.loads(path.read_text(encoding='utf-8-sig'))

          parts = str(data.get('version', '1.0.0')).split('.')
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit(f"Unsupported distribution version: {data.get('version')!r}")
          major, minor, patch = map(int, parts)
          data['version'] = f'{major}.{minor}.{patch + 1}'

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n',
                          encoding='utf-8', newline='\n')
          print(f"LoM distribution version -> {data['version']}")

      - name: Synchronize distribution manifest
        if: steps.pack.outputs.changed == 'true'
        run: |
          python3 tools/rebuild_distribution.py --write
          python3 tools/rebuild_distribution.py

      - name: Verify Map Atlases manifest state
        if: steps.pack.outputs.changed == 'true'
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import unquote

          jar_path = Path('mods/map_atlases-1.20-6.0.20.jar')
          data = json.loads(Path('distribution.json').read_text(encoding='utf-8'))
          modules = data['servers'][0]['modules']

          hits = []
          expected_suffix = '/mods/map_atlases-1.20-6.0.20.jar'

          def walk(node):
              if isinstance(node, list):
                  for value in node:
                      walk(value)
              elif isinstance(node, dict):
                  artifact = node.get('artifact')
                  if isinstance(artifact, dict):
                      url = unquote(str(artifact.get('url', '')))
                      if url.endswith(expected_suffix):
                          hits.append((node, artifact))
                  for key, value in node.items():
                      if key != 'artifact':
                          walk(value)

          walk(modules)

          if len(hits) != 1:
              raise SystemExit(f'Expected exactly one Map Atlases manifest artifact, got {len(hits)}')

          _, artifact = hits[0]
          expected_md5 = hashlib.md5(jar_path.read_bytes()).hexdigest()
          if artifact.get('MD5') != expected_md5:
              raise SystemExit(f"Map Atlases MD5 mismatch: {artifact.get('MD5')} != {expected_md5}")
          if artifact.get('size') != jar_path.stat().st_size:
              raise SystemExit('Map Atlases size mismatch')

          print(f"Map Atlases OK size={jar_path.stat().st_size} md5={expected_md5}")
          print(f"distribution version={data['version']}")

      - name: Commit manifest and push pack update
        if: steps.pack.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add distribution.json
          git commit -m 'build: publish LoM Map Atlases update'

          git fetch origin dev
          git rebase origin/dev
          git push origin HEAD:dev

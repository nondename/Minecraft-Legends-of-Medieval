name: One-time LoM Skin Loader 0.1.3 fix

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/fix-lom-skin-loader.yml'
      - '.github/skinfix/**'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Reconstruct verified LoM Skin Loader 0.1.3
        shell: bash
        run: |
          set -euo pipefail
          cat .github/skinfix/part*.b64 | base64 --decode > /tmp/lom-skin-loader-0.1.3.jar
          printf '%s  %s\n' \
            '66afdc5bb34d0c23e8a0cfed2679610d817f96bc15630f65b8ffaa8814253b3a' \
            '/tmp/lom-skin-loader-0.1.3.jar' | sha256sum --check
          unzip -t /tmp/lom-skin-loader-0.1.3.jar

      - name: Replace broken 0.1.2
        shell: bash
        run: |
          set -euo pipefail
          rm -f mods/lom-skin-loader-0.1.2.jar
          cp /tmp/lom-skin-loader-0.1.3.jar mods/lom-skin-loader-0.1.3.jar

      - name: Commit verified replacement and remove one-time bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/skinfix
          rm -f .github/workflows/fix-lom-skin-loader.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(mods): replace broken LoM Skin Loader 0.1.2 with 0.1.3'
          git push origin HEAD:dev

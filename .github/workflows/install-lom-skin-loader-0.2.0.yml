name: Install LoM Skin Loader 0.2.0

on:
  push:
    branches: [ dev ]
    paths:
      - '.github/workflows/install-lom-skin-loader-0.2.0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-lom-skin-loader-dev
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Download and verify LoM Skin Loader 0.2.0
        shell: bash
        run: |
          set -euo pipefail
          url='https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-7950-8211-9d17-e5ae966c9fc2/raw?se=2026-10-07T15%3A31%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=e2ac405d-4fe6-5e04-ac4e-a30c0825921a&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-07T05%3A14%3A36Z&ske=2026-10-08T05%3A14%3A36Z&sks=b&skv=2026-02-06&sig=3UE9PiMzfQg0glUVbn0idwgoIw04jEPZImA0XYmsMYA%3D'
          archive='/tmp/lom-skin-loader.zip'
          out='mods/lom-skin-loader-0.2.0.jar'
          curl --fail --location --retry 4 --retry-delay 2 "$url" --output "$archive"
          unzip -t "$archive" >/dev/null
          unzip -p "$archive" 'lom-skin-loader-0.2.0.jar' > "$out"
          echo '5a501f2d64e26ff5cccc91b217d4c76ec89d88495ce5dde9ab3a6d2dde210b85  '"$out" | sha256sum -c -
          unzip -t "$out" >/dev/null
          unzip -p "$out" META-INF/mods.toml | grep -q 'lom_skin_loader'
          rm -f mods/lom-skin-loader-0.1.3.jar

      - name: Rebuild distribution manifest
        run: python3 tools/rebuild_distribution.py --write

      - name: Commit synchronized mod and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/install-lom-skin-loader-0.2.0.yml
          git add -A
          git commit -m "feat(skins): sync launcher cosmetics between players"
          git push origin HEAD:dev

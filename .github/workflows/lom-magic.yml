name: LoM Magic build
on:
  pull_request:
    paths:
      - 'addons/lom-magic/**'
      - '.github/workflows/lom-magic.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons/lom-magic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile and build LoM Magic
        run: gradle --no-daemon build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lom-magic-dev
          path: addons/lom-magic/build/libs/*.jar
